<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <h1 class="logo">🛒 ShopZone</h1>
      <div class="nav-links">
        <a href="index.html" class="product">Products</a>
        <a href="cart.html" class="cart-link">
            Cart (<span id="cart-count">0</span>)
        </a>
      </div>
    </nav>
  </header>

  <main>
      <!-- Search and Filter Section -->
    <div class="filters-container">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search products...">
      </div>

      <div class="filter-buttons">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="electronics">Electronics</button>
        <button class="filter-btn" data-category="clothing">Clothing</button>
        <button class="filter-btn" data-category="shoes">Shoes</button>
        <button class="filter-btn" data-category="accessories">Accessories</button>
        <button class="filter-btn" data-category="home">Home</button>
        <button class="filter-btn" data-category="price">Sort by Price</button>
      </div>
      <p id="product-count" style="margin: 20px 0; color: #666;"></p>
      <h3 class="no-product"></h3>
    </div>

    <!-- Products Grid -->
    <div class="products-container" id="products-container">
        <!-- Products will be dynamically added here -->
    </div>
  </main>

  <script src="products.js"></script>
  <script src="script.js"></script>
</body>
</html>
